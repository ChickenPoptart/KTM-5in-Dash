[platformio]
default_envs = waveshare5

; Waveshare ESP32-S3-Touch-LCD-5 (800x480 RGB panel, GT911 touch, onboard
; CAN transceiver). Upload over its USB-C port.
[env:waveshare5]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ESP32-S3-WROOM-1-N16R8: 16 MB quad flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    mikalhart/TinyGPSPlus@^1.0.3
    ; Phone link: the dash appears to the Chronos app as a watch
    fbiego/ChronosESP32@^1.9.1
build_flags =
    -D BOARD_HAS_PSRAM
    ; Serial goes over the USB-C port
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; The bench build: as above plus the demo (hold the dash for 1 s), for
; tuning the screen and recording videos. Not for the bike.
[env:waveshare5_demo]
extends = env:waveshare5
build_flags =
    ${env:waveshare5.build_flags}
    -D DASH_DEMO

; Host-side unit tests for pure dashboard logic: pio test -e native
[env:native]
platform = native
test_framework = unity
